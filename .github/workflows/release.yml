name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require a matching version tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

  native:
    needs: version
    uses: ./.github/workflows/native.yml

  draft:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Create draft release with tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "$GITHUB_REF_NAME — V8 $(cat deps/VERSION)" \
            --notes-file RELEASE_NOTES.md dist/*
