name: Format Code

on: [pull_request, workflow_dispatch]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                go-version: '1.25.x'
            - name: Check Go formatting
              run: test -z "$(gofmt -l *.go deps/include/*/vendor.go deps/include/vendor.go)"
