name: Check V8 version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compare with Chrome stable
        working-directory: deps
        run: ./v8_upgrade.sh
      - name: Show proposed engine version
        run: |
          echo 'Update the V8/depot_tools pins, headers, native packages and binding tests together.'
          git diff -- deps/VERSION
