name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Initialize pinned config parser
        run: git submodule update --init --depth 1 deps/depot_tools
      - run: python3 -m unittest discover -s deps -p 'test_*.py'
      - run: test -z "$(gofmt -l *.go deps/include/*/vendor.go deps/include/vendor.go)"
      - run: sh -n deps/v8_compile.sh
      - run: bash -n deps/setup-linux-toolchains.sh deps/setup-musl-sysroot.sh deps/build-consumer-image.sh deps/test-native-package.sh

  native:
    needs: scripts
    uses: ./.github/workflows/native.yml
